<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS OCR - Local Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d0e;
    --panel:#131618;
    --panel-2:#0f1213;
    --line:#22272a;
    --text:#e7eaec;
    --text-dim:#8a9198;
    --accent:#3fe6b8;
    --accent-dim:#1f6e58;
    --error:#e5484d;
    --warn:#e8a33d;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,.brand-title,.field span,.output-header span{
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{max-width:1180px;margin:0 auto;padding:20px 24px 48px}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:34px;height:34px;border:1px solid var(--accent-dim);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;color:var(--accent);
    font-size:11px;font-weight:700;background:rgba(63,230,184,0.06);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-title{font-weight:700;font-size:17px}
  .brand-sub{color:var(--text-dim);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
  .status{
    display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-dim);
    border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px;
    cursor:pointer;user-select:none;background:var(--panel-2);
  }
  .status:hover{border-color:#33393c}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#5a6167;flex:none}
  .status-dot.ok{background:var(--accent);box-shadow:0 0 8px 1px rgba(63,230,184,.55)}
  .status-dot.warn{background:var(--warn);box-shadow:0 0 8px 1px rgba(232,163,61,.5);animation:pulse 1.4s infinite ease-in-out}
  .status-dot.err{background:var(--error);box-shadow:0 0 8px 1px rgba(229,72,77,.5)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status-meta{color:#565d63}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .dropzone{
    position:relative;border:1px dashed #2b3134;border-radius:var(--radius);
    min-height:190px;display:flex;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;overflow:hidden;background:var(--panel-2);
    transition:border-color .15s ease,background .15s ease;
  }
  .dropzone.drag{border-color:var(--accent);background:rgba(63,230,184,.05)}
  .drop-icon{font-size:22px;color:var(--text-dim);margin-bottom:6px}
  .drop-title{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
  .drop-sub{margin:4px 0 0;color:var(--text-dim);font-size:12px}
  .preview-img{width:100%;height:100%;max-height:260px;object-fit:contain;display:block}
  .file-pill{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-dim);font-size:13px}
  .file-pill .ext{
    background:var(--accent-dim);color:#dffff5;font-size:10.5px;font-weight:600;
    padding:2px 6px;border-radius:2px;letter-spacing:.4px;
  }
  .scan-line{
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    box-shadow:0 0 14px 2px rgba(63,230,184,.7);
    animation:sweep 1.6s linear infinite;
  }
  @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(190px)}}
  .filemeta{margin-top:10px;font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;gap:12px}
  .filemeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .controls{margin-top:18px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field span{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600}
  select,input[type="number"]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:9px 10px;font:inherit;width:100%;
  }
  select:hover,input:hover{border-color:#33393c}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim)}
  .toggle input{accent-color:var(--accent);width:14px;height:14px}
  .toggle.wide{grid-column:1 / -1;display:flex;justify-content:space-between}
  .toggle.wide input[type="number"]{width:78px;padding:5px 8px;font-size:12.5px}
  .run-btn{
    margin-top:4px;background:var(--accent);color:#06110d;border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;
    padding:12px 14px;border-radius:var(--radius);cursor:pointer;
    transition:transform .08s ease,opacity .15s ease;
  }
  .run-btn:hover{opacity:.92}
  .run-btn:active{transform:translateY(1px)}
  .run-btn:disabled{opacity:.45;cursor:not-allowed}
  .panel-output{min-height:520px;display:flex;flex-direction:column}
  .output-header{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);
  }
  .output-header span{font-weight:600;font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
  .output-actions{display:flex;gap:8px}
  .output-actions button{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);
    font:inherit;font-size:12px;padding:6px 10px;border-radius:var(--radius);cursor:pointer;
  }
  .output-actions button:hover{border-color:#33393c;color:var(--text)}
  .output-actions button:disabled{opacity:.35;cursor:not-allowed}
  .output-text{
    flex:1;margin:0;white-space:pre-wrap;word-break:break-word;overflow:auto;
    color:var(--text);font-size:13px;line-height:1.6;padding:2px;
  }
  .output-text.placeholder{color:#565d63}
  .output-text.error{color:var(--error)}
  .meta-strip{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:#5a6167;
  }
  .meta-strip b{color:var(--text-dim);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">OCR</div>
      <div class="brand-text">
        <span class="brand-title">DMS OCR</span>
        <span class="brand-sub">local console</span>
      </div>
    </div>
    <div class="status" id="statusPill" title="Click to re-check">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">checking engine...</span>
      <span class="status-meta" id="statusMeta"></span>
    </div>
  </div>

  <div class="grid">
    <section class="panel panel-input">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" hidden accept="image/png,image/jpeg,image/bmp,image/tiff,image/webp,application/pdf">
        <div id="dropContent">
          <div class="drop-icon">+</div>
          <p class="drop-title">Drop a document</p>
          <p class="drop-sub">or click to browse - image or PDF</p>
        </div>
        <img id="previewImg" class="preview-img" hidden alt="preview">
        <div class="file-pill" id="filePill" hidden></div>
        <div class="scan-line" id="scanLine" hidden></div>
      </div>
      <div class="filemeta" id="fileMeta" hidden></div>

      <div class="controls">
        <label class="field">
          <span>Document type</span>
          <select id="ocrType">
            <option value="general">General</option>
            <option value="table" selected>Table</option>
            <option value="form">Form</option>
            <option value="handwritten">Handwritten</option>
            <option value="dense">Dense / multi-column</option>
          </select>
        </label>

        <label class="field">
          <span>Output format</span>
          <select id="outputFormat">
            <option value="markdown" selected>Markdown</option>
            <option value="excel">Excel sheet</option>
            <option value="json">JSON</option>
            <option value="plain_text">Plain text</option>
          </select>
        </label>

        <div class="field">
          <span>Preprocessing</span>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="denoise"> Denoise</label>
            <label class="toggle"><input type="checkbox" id="sharpen" checked> Sharpen</label>
            <label class="toggle"><input type="checkbox" id="enhanceContrast" checked> Contrast</label>
            <label class="toggle"><input type="checkbox" id="binarize"> Binarize</label>
            <label class="toggle wide">
              Resize factor
              <input type="number" id="resizeFactor" value="1.0" min="0.25" max="4" step="0.1">
            </label>
          </div>
        </div>

        <button id="submitBtn" class="run-btn" disabled>Run OCR -></button>
      </div>
    </section>

    <section class="panel panel-output">
      <div class="output-header">
        <span>Result</span>
        <div class="output-actions">
          <button id="copyBtn" disabled>Copy</button>
          <button id="downloadBtn" disabled>Download</button>
        </div>
      </div>
      <pre class="output-text placeholder" id="outputText">- select a document and run OCR -</pre>
      <div class="meta-strip" id="metaStrip" hidden></div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const dropzone = $('dropzone');
const fileInput = $('fileInput');
const dropContent = $('dropContent');
const previewImg = $('previewImg');
const filePill = $('filePill');
const fileMeta = $('fileMeta');
const scanLine = $('scanLine');
const submitBtn = $('submitBtn');
const outputText = $('outputText');
const copyBtn = $('copyBtn');
const downloadBtn = $('downloadBtn');
const metaStrip = $('metaStrip');
const statusDot = $('statusDot');
const statusText = $('statusText');
const statusMeta = $('statusMeta');
const statusPill = $('statusPill');

let currentFile = null;
let lastResultText = '';
let lastFilename = 'ocr_result';
let lastExtension = 'md';
let lastMime = 'text/markdown';
let lastOutputUrl = '';

function setDownloadFormat(format){
  const formats = {
    markdown: { extension: 'md', mime: 'text/markdown' },
    excel: { extension: 'xlsx', mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' },
    json: { extension: 'json', mime: 'application/json' },
    plain_text: { extension: 'txt', mime: 'text/plain' },
  };
  const selected = formats[format] || formats.markdown;
  lastExtension = selected.extension;
  lastMime = selected.mime;
  downloadBtn.textContent = `Download .${lastExtension}`;
}

async function checkHealth(){
  statusDot.className = 'status-dot warn';
  statusText.textContent = 'checking engine...';
  statusMeta.textContent = '';
  try{
    const res = await fetch('/health');
    const data = await res.json();
    if (!res.ok) throw new Error('bad status');
    statusDot.className = 'status-dot ok';
    statusText.textContent = 'engine online';
    statusMeta.textContent = data.model ? `- ${data.model}` : '';
  }catch(e){
    statusDot.className = 'status-dot err';
    statusText.textContent = 'engine unreachable';
    statusMeta.textContent = '';
  }
}

function humanSize(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function setFile(file){
  if (!file) return;
  currentFile = file;
  submitBtn.disabled = false;

  const isImage = file.type.startsWith('image/');
  dropContent.hidden = true;
  fileMeta.hidden = false;
  fileMeta.innerHTML = `<span title="${file.name}">${file.name}</span><span>${humanSize(file.size)}</span>`;

  if (isImage){
    previewImg.src = URL.createObjectURL(file);
    previewImg.hidden = false;
    filePill.hidden = true;
  } else {
    previewImg.hidden = true;
    filePill.hidden = false;
    filePill.innerHTML = `<span class="ext">PDF</span><span>${file.name}</span>`;
  }
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));
statusPill.addEventListener('click', checkHealth);
$('outputFormat').addEventListener('change', () => setDownloadFormat($('outputFormat').value));

['dragenter','dragover'].forEach((eventName) => {
  dropzone.addEventListener(eventName, (event) => {
    event.preventDefault();
    dropzone.classList.add('drag');
  });
});

['dragleave','drop'].forEach((eventName) => {
  dropzone.addEventListener(eventName, (event) => {
    event.preventDefault();
    dropzone.classList.remove('drag');
  });
});

dropzone.addEventListener('drop', (event) => {
  const file = event.dataTransfer.files[0];
  if (file) setFile(file);
});

submitBtn.addEventListener('click', async () => {
  if (!currentFile) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Reading document...';
  scanLine.hidden = false;
  outputText.className = 'output-text placeholder';
  outputText.textContent = 'processing...';
  copyBtn.disabled = true;
  downloadBtn.disabled = true;
  metaStrip.hidden = true;

  const fd = new FormData();
  fd.append('file', currentFile);
  fd.append('ocr_type', $('ocrType').value);
  fd.append('output_format', $('outputFormat').value);

  const denoise = $('denoise').checked;
  const sharpen = $('sharpen').checked;
  const enhanceContrast = $('enhanceContrast').checked;
  const binarize = $('binarize').checked;
  const resizeFactor = parseFloat($('resizeFactor').value || '1.0');
  const anyPreprocess = denoise || sharpen || enhanceContrast || binarize || resizeFactor !== 1.0;

  fd.append('preprocess', String(anyPreprocess));
  fd.append('resize_factor', String(resizeFactor));
  fd.append('denoise', String(denoise));
  fd.append('enhance_contrast', String(enhanceContrast));
  fd.append('sharpen', String(sharpen));
  fd.append('binarize', String(binarize));

  try{
    const res = await fetch('/ocr', { method: 'POST', body: fd });
    const data = await res.json();

    if (!res.ok){
      const detail = data.detail || 'OCR request failed.';
      outputText.className = 'output-text error';
      outputText.textContent = `Error (${res.status}): ${detail}`;
      lastResultText = '';
      lastOutputUrl = '';
    } else {
      outputText.className = 'output-text';
      outputText.textContent = data.text || '(empty result)';
      lastResultText = data.text || '';
      lastFilename = (data.filename || 'ocr_result').replace(/\.[^/.]+$/, '');
      lastOutputUrl = data.output_url || '';
      setDownloadFormat($('outputFormat').value);

      const meta = data.metadata || {};
      metaStrip.hidden = false;
      metaStrip.innerHTML = `
        <span><b>Model</b> ${meta.model || '-'}</span>
        <span><b>Type</b> ${meta.ocr_type || '-'}</span>
        <span><b>Pages</b> ${meta.total_pages ?? '-'}</span>
        <span><b>Preprocessed</b> ${meta.preprocessed ? 'yes' : 'no'}</span>
      `;
      copyBtn.disabled = !lastResultText;
      downloadBtn.disabled = !lastResultText;
    }
  }catch(e){
    outputText.className = 'output-text error';
    outputText.textContent = `Could not reach the OCR backend. Is uvicorn running on this port? (${e.message})`;
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Run OCR ->';
    scanLine.hidden = true;
  }
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(lastResultText);
  copyBtn.textContent = 'Copied';
  setTimeout(() => copyBtn.textContent = 'Copy', 1200);
});

downloadBtn.addEventListener('click', () => {
  if (lastOutputUrl){
    const a = document.createElement('a');
    a.href = lastOutputUrl;
    a.download = `${lastFilename}_ocr.${lastExtension}`;
    a.click();
    return;
  }

  const blob = new Blob([lastResultText], { type: lastMime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${lastFilename}_ocr.${lastExtension}`;
  a.click();
  URL.revokeObjectURL(url);
});

setDownloadFormat($('outputFormat').value);
checkHealth();
</script>
</body>
</html>
